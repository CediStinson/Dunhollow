<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dunhollow Autoplay</title>
<style>
  :root{ --bg:#140e06; --panel:#1e160b; --line:#5a4422; --ink:#f0e2c0; --dim:#a89878; --gold:#e8c060; --red:#e07060; --green:#9ad07a; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px/1.4 Georgia,serif; }
  #wrap{ display:flex; height:100%; }
  #side{ width:330px; min-width:330px; display:flex; flex-direction:column; border-right:1px solid var(--line); background:var(--panel); }
  #game{ flex:1; border:0; background:#000; }
  h1{ font-size:15px; letter-spacing:3px; text-transform:uppercase; color:var(--gold); margin:12px 14px 6px; }
  .row{ display:flex; gap:6px; align-items:center; margin:6px 14px; flex-wrap:wrap; }
  button,select{ background:#3a2a12; border:1px solid #9a7a32; color:#f0d890; border-radius:4px; padding:5px 10px; font:inherit; cursor:pointer; }
  button:hover{ background:#4a3618; }
  input[type=range]{ flex:1; accent-color:#c8a050; }
  #stats{ margin:6px 14px; padding:8px 10px; border:1px solid var(--line); border-radius:4px; background:#160f07; display:grid; grid-template-columns:auto 1fr; gap:2px 10px; }
  #stats b{ color:var(--dim); font-weight:normal; }
  #log{ flex:1; overflow:auto; margin:6px 14px 14px; padding:6px 8px; border:1px solid var(--line); border-radius:4px; background:#100b05; font-size:12px; }
  #log div{ margin:2px 0; border-bottom:1px solid #2a1f10; padding-bottom:2px; }
  #log .fight{ color:#e8b080; } #log .death{ color:var(--red); } #log .quest{ color:var(--green); } #log .gear{ color:#a8c8f0; } #log .move{ color:var(--dim); } #log .level{ color:var(--gold); }
  small{ color:var(--dim); }
  @media (max-width:760px){ #wrap{ flex-direction:column; } #side{ width:100%; min-width:0; height:42%; border-right:0; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<div id="wrap">
  <div id="side">
    <h1>Autoplay</h1>
    <div class="row"><small>A bot plays a fresh character from the start, like a casual player: it reacts a little late, misses blocks, dies now and then and learns. It never touches your saves.</small></div>
    <div class="row">
      <select id="cls"><option value="melee">Melee</option><option value="necro">Necromancer</option><option value="mage">Mage</option></select>
      <button id="go">New game</button>
      <button id="pause">Pause</button>
    </div>
    <div class="row"><small>Speed</small><input id="speed" type="range" min="1" max="12" step="1" value="1"><span id="spv">1×</span></div>
    <div id="stats"></div>
    <div id="log"></div>
  </div>
  <iframe id="game" title="Dunhollow"></iframe>
</div>

<script type="text/x-bot" id="bot-src">
(function(){
'use strict';
const CFG=window.BOT_CFG||{cls:'melee',speed:1};
let seed=(CFG.seed||Date.now())%2147483646+1; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
const gauss=(m,s)=>{ let u=0; while(!u) u=rnd(); return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*rnd()); };
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// ── never touch the player's saves: no local saves, no server saves ──
try{ writeSaves=function(){ return true; }; }catch(e){}
try{ saveGame=function(){}; }catch(e){}
try{ cloud=async function(){ return {ok:false}; }; }catch(e){}

const B=window.BOT={ cfg:CFG, speed:CFG.speed||1, paused:false, fast:!!CFG.fast, log:[], finished:false };
const LAND=a=>{
  if(/^under_|^ember/.test(a)) return 'Undercity';
  if(['waystation','drywash','oasis','glassdunes','singingdunes','saltpan','redmesa','crater','bonewaste'].includes(a)||/^temple/.test(a)) return 'Desert';
  if(['fenpath','fen','barrow','reedbank','blackwater','sunkenwood'].includes(a)) return 'Swamp';
  if(['mistmere','silvergate','sylvhaven','fellings','ruin','elfroad','moonbath'].includes(a)) return 'Elven woods';
  if(/^cave\d/.test(a)||['warren','gbtunnel'].includes(a)) return 'Goblin warren';
  if(['citygate','market','lowstreets','keepward','inn','smithy','tailorshop','chapelin','kingsroad','steamcellar','dicenden','guildhall','goldhouse','barracks','docks','portfearn','fearnhouse','northroad','weavetent'].includes(a)) return 'Hollowmere';
  return 'Valley'; };
const S=B.stats={ t0:gt, fights:[], deaths:[], areas:{}, lands:{}, quests:[], levels:[], buys:[], sells:[], equips:[], dialogs:0, readT:0, stuck:[] };
function note(msg,kind){ const e={t:Math.round(gt), area:areaId, msg, kind:kind||''}; B.log.push(e); if(B.log.length>4000) B.log.splice(0,1000); }
B.note=note;
const skill=()=>1-Math.exp(-S.fights.length/45);           // a casual player gets better with every fight
const lvl=()=>playerLevel();

// ── the journal, cheaply ──
let jCache=null, jAt=-9;
function journal(){ if(jCache && gt-jAt<2) return jCache; const m={}; JOURNAL.forEach(([t,f])=>{ try{ const r=f(); m[t]=r?r[0]:null; }catch(e){ m[t]=null; } }); jCache=m; jAt=gt; return m; }
const jHash=()=>Object.entries(journal()).map(([k,v])=>v?k[0]+v[0]:'').join('');
const invHash=()=>player.inv.join(',');
const day=()=>Math.floor(dayClock/DAY_LEN);
let lastJ=null;
function watchJournal(){ const J=journal(); if(!lastJ){ lastJ=J; return; }
  for(const k in J){ if(J[k]!==lastJ[k]){ if(J[k]==='done'){ S.quests.push({q:k,t:gt,lvl:lvl(),area:areaId}); note('Quest done: '+k,'quest'); } else if(J[k]==='active' && !lastJ[k]) note('New quest: '+k,'quest'); else if(J[k]==='failed') note('Quest failed: '+k,'quest'); } }
  lastJ=J; }

// ── the world as a graph of doors ──
let G=null, gAt=-999;
function graph(){ if(G && gt-gAt<30) return G; G={}; gAt=gt;
  for(const a of Object.keys(AREAS)){ let L=[]; try{ L=a===areaId?OBJECTS:(AREAS[a].objects?AREAS[a].objects():[]); }catch(e){} const E=G[a]={out:[], beds:0, mobs:0};
    L.forEach(o=>{ if(!o) return; if(o.type==='teleporter' && o.to && AREAS[o.to]){ let lk=false; try{ lk=!!(o.locked&&o.locked()); }catch(e){} if(!lk) E.out.push(o.to); }
      else if(o.inside && AREAS[o.inside] && o.fp) E.out.push(o.inside); else if(o.type==='bed' && !o.owner) E.beds++; });
    try{ E.mobs=(AREAS[a].mobs?AREAS[a].mobs():[]).filter(m=>m && m.type!=='dummy').length; }catch(e){} }
  return G; }
const fightLvl=a=>2*tierOf(a);
const AVOID={};
function safeFor(a,bold){ if(AVOID[a] && AVOID[a]>gt) return false; const g=graph()[a]; if(!g || !g.mobs) return true; return fightLvl(a)<=lvl()+2+(bold||0); }
const BAN={};                                      // doors that led nowhere lately (no way through): left alone for a day
const banned=(a,b)=>BAN[a+'>'+b] && BAN[a+'>'+b]>gt;
function route(from,to,bold){ const prev={[from]:null}, q=[from];
  while(q.length){ const a=q.shift(); if(a===to) break; for(const b of (graph()[a]||{out:[]}).out){ if(b in prev || banned(a,b)) continue; if(b!==to && !safeFor(b,bold)) continue; prev[b]=a; q.push(b); } }
  if(!(to in prev)) return null; const p=[]; for(let a=to;a!==from;a=prev[a]) p.unshift(a); return p; }

// ── reading the journal, as a player does: who and where do my open tasks talk about? ──
let WHO=null;
function whoIndex(){ if(WHO) return WHO; WHO={names:[], places:[]};
  for(const a of Object.keys(AREAS)){ let L=[]; try{ L=AREAS[a].npcs?AREAS[a].npcs():[]; }catch(e){} L.forEach(n=>{ if(n && n.name && n.id) WHO.names.push({name:n.name, id:n.id, area:a}); });
    (AREAS[a].label||'').split(' · ').map(x=>x.replace(/^The /,'').trim()).forEach(lb=>{ if(lb.length>=4) WHO.places.push({label:lb, area:a}); }); }
  const cnt={}; WHO.places.forEach(p=>cnt[p.label]=(cnt[p.label]||0)+1); WHO.places=WHO.places.filter(p=>cnt[p.label]<=2);
  try{ for(const k in ROUTINES){ const R=ROUTINES[k]; R.slots.forEach(sl=>WHO.names.push({name:R.name, id:R.ids[sl.area]||k, area:sl.area})); } }catch(e){}
  return WHO; }
let HOT={areas:{}, ids:{}, at:-99, j:''}; const MISS={};
function hot(){ const dark=typeof nightAmt==='function' && nightAmt()>0.4, jh=jHash()+(dark?'N':'D'); if(HOT.j===jh && gt-HOT.at<60) return HOT; HOT={areas:{}, ids:{}, at:gt, j:jh}; const W=whoIndex();
  JOURNAL.forEach(([t,f])=>{ let r=null; try{ r=f(); }catch(e){} if(!r || r[0]!=='active') return; const txt=String(r[1]||'');
    if((CFG.cls!=='necro' && /Vesna/.test(txt)) || (CFG.cls!=='mage' && /Orvell|Magister/.test(txt))) return;      // another school's lessons: not for me
    const night=/after dark|at night|by night|midnight|under the moon|moonlight|moon-shadow|walk only at night/i.test(txt); if(night && !dark) return;   // that one waits for the dark
    let found=0; const w=night?3:1, add=(a,k)=>{ found++; HOT.areas[a]=(HOT.areas[a]||0)+k*w; if(night) (HOT.dark=HOT.dark||{})[a]=1; if(/keep still|stand still|keep quiet|wait/i.test(txt)) (HOT.still=HOT.still||{})[a]=1; };
    W.names.forEach(n=>{ const first=n.name.split(' ')[0]; if(txt.includes(n.name) || (first.length>=4 && new RegExp('\\b'+first+'\\b').test(txt))){ const m=MISS[n.id+'@'+n.area]; if(m && m===(dark?'night':'day') && gt-MISS[n.id+'@'+n.area+'t']<DAY_LEN*1.5) return; HOT.ids[n.id]=t; add(n.area,1); } });
    W.places.forEach(pl=>{ if(txt.includes(pl.label)) add(pl.area,2); });
    Object.keys(AREAS).forEach(a=>{ if(a.length>=4 && /^[a-z]+$/.test(a) && new RegExp('\\b'+a+'\\b','i').test(txt)) add(a,2); });
    const V=S.vague||(S.vague={}), Q=S.qseen||(S.qseen={}); const key=t+'|'+txt.slice(0,90); if(!Q[key]) Q[key]={t:gt, found}; (S.qcur||(S.qcur={}))[t]=key;
    if(!found) V[t]=txt.replace(/<[^>]+>/g,'').slice(0,200); else delete V[t]; });
  return HOT; }

// ── clicking, the way you do ──
function clickTile(i,j){ const q=P(i+0.5,j+0.5), r=gc.getBoundingClientRect(); const x=r.left+q.x, y=r.top+q.y; pointerDown(x,y); pointerUp(x,y); }
function skulls(){ return mobs.filter(m=>m.hostile && !m.dead && !m.gone && m.tier && foeLevel(m)-lvl()>=3); }
function nearSkull(i,j,r){ return skulls().some(m=>Math.max(Math.abs(m.i-i),Math.abs(m.j-j))<=r); }
function clickAvoiding(i,j){ const add=[]; skulls().forEach(m=>{ for(let a=-2;a<=2;a++) for(let b=-2;b<=2;b++){ const k=(m.i+a)+','+(m.j+b); if(!blocked.has(k) && !(m.i+a===i&&m.j+b===j)){ blocked.add(k); add.push(k); } } });
  try{ clickTile(i,j); } finally{ add.forEach(k=>blocked.delete(k)); } }

// ── gear: what is better, for this kind of fighter ──
const CASTER=CFG.cls!=='melee';
function gscore(id){ if(!id || !ITEMS[id]) return -1; const it=ITEMS[id], st=ITEM_STATS[id]||{}; let s=0;
  try{ s+=armourOf(id)*3; }catch(e){} s+=(GEAR_HP[id]||0)*0.4+(st.ap||0)*(CASTER?0.3:1.5)+(st.agi||0)*1.2+(st.magic||0)*(CASTER?2.5:0)+(st.mreg||0)*(CASTER?1:0);
  if(it.slot==='weapon'){ const W=WEAPONS[id]; if(!W) return -1;
    if(W.magic){ if(!CASTER) return 0.1; const nec=NECRO_STAVES.includes(id); if((CFG.cls==='necro')!==nec) return 0.2; s+=25*W.magic; }
    else { if(CASTER) return 0.15; s+=(typeof weaponDmg==='function'?weaponDmg(id):W.dmg)/Math.max(0.12,W.wind)*0.3; } }
  return s; }
const WEAR=['weapon','armor','head','hands','feet','offhand','neck','special'];
function upgrades(){ const E=player.opts.equip, out=[];
  player.inv.forEach((id,k)=>{ if(!id||!ITEMS[id]) return; const sl=ITEMS[id].slot; if(!WEAR.includes(sl)) return; if(!itemFits(id,player.opts.gender)) return;
    if(sl==='offhand' && id==='morwen_lantern') return;
    if(gscore(id)>gscore(E[sl])+0.5) out.push({k,id,sl}); });
  return out.sort((a,b)=>gscore(b.id)-gscore(a.id)); }
function equipBest(){ const u=upgrades(); if(!u.length) return false; const {k,id,sl}=u[0], was=player.opts.equip[sl];
  try{ if(moveItem({kind:'inv',key:k},{kind:'eq',key:sl})){ delete player.opts._ck; refreshPlayerHp(false); updateHud(); S.equips.push({id,t:gt,lvl:lvl()}); note('Puts on '+ITEMS[id].name+(was&&ITEMS[was]?' (instead of '+ITEMS[was].name+')':''),'gear'); return true; } }catch(e){}
  return false; }
const healK=()=>{ let best=-1, bh=0; player.inv.forEach((id,k)=>{ const h=id&&ITEMS[id]&&!ITEMS[id].cure&&ITEMS[id].heal; if(h && (best<0||h>bh)){ best=k; bh=h; } }); return best; };
const healCount=()=>(typeof invFlat==='function'?invFlat():player.inv).filter(id=>id&&ITEMS[id]&&ITEMS[id].heal&&!ITEMS[id].cure).length;
function isJunk(id){ if(!id||!ITEMS[id]) return false; if(typeof QUEST_ITEMS!=='undefined' && QUEST_ITEMS.has(id)) return false; const it=ITEMS[id];
  if(it.heal||it.mana||it.cure) return false; if(id==='shovel'||id==='fishing_rod'||id==='bottled_wisp') return false;
  if(WEAR.includes(it.slot)){ if(it.slot==='weapon' && WEAPONS[id] && WEAPONS[id].magic && CASTER) return gscore(id)<gscore(player.opts.equip.weapon)-5; return gscore(id)<=gscore(player.opts.equip[it.slot]); }
  if(['torso','legs'].includes(it.slot)) return true;
  return !!(typeof SELL_MISC!=='undefined' && SELL_MISC.has(id)); }

// ── a casual fighter ──
const SIDES=['left','up','right'];
let FT=null;                                     // what this fight looks like from the inside
function fightStart(){ const f0=combat.foe; FT={ start:gt, hp0:player.hp, max:player.maxHp, foes:f0?[f0.name+' Lv'+foeLevel(f0)]:[], lv:lvl(), area:areaId, top:f0?foeLevel(f0):0, lastSide:null, nextAtk:clock+0.6+rnd()*0.4, wu:null, prevState:null, potion:false, low:player.hp };
  if(f0) note('Fight: '+FT.foes[0]+(FT.top-FT.lv>=3?'  ☠ (way above me)':''),'fight'); }
function fightEnd(lost){ if(!FT) return; const r={area:FT.area, land:LAND(FT.area), foes:FT.foes, top:FT.top, lv:FT.lv, lost, hpPct:Math.round(100*(FT.hp0-Math.max(0,lost?0:FT.low))/Math.max(1,FT.max)), dur:Math.round(gt-FT.start)};
  S.fights.push(r); if(lost){ S.deaths.push(r); const recent=S.deaths.filter(x=>x.area===r.area && gt-(x.t||gt)<DAY_LEN).length; r.t=gt; if(recent>=2){ AVOID[r.area]=gt+DAY_LEN*2; note('Beaten here twice now. Leaving '+(AREAS[r.area].label||r.area)+' alone for a couple of days.','death'); } note('Died: '+FT.foes.join(', ')+' (I was Lv '+FT.lv+')','death'); } else note('Won in '+r.dur+'s, lost '+r.hpPct+'% health','fight'); FT=null; }
function other(d){ const o=SIDES.filter(x=>x!==d); return o[Math.floor(rnd()*o.length)]; }
function spellPick(f,sk){                       // which spell, as a casual caster would: by what it does, now and then by his guard
  const SP=spellsFor(), m=player.mana??100, cost=s=>spellCost(SP[s]||{});
  let want;
  if(CFG.cls==='necro'){ const sk0=(typeof SKEL!=='undefined' && SKEL && !SKEL.crumble);
    if(!sk0 && m>=cost('left') && rnd()<0.8) want='left'; else if(player.hp<player.maxHp*0.6 && m>=cost('up')) want='up'; else want=rnd()<0.6?'right':'up'; }
  else { want=['left','right','up'][Math.floor(rnd()*3)]; if(rnd()<0.5) want='left'; }
  if(f.guardDir===want && rnd()<0.3+0.6*sk){ const alt=SIDES.filter(s=>s!==f.guardDir); want=alt[Math.floor(rnd()*2)]; }
  return want; }
function fightStep(){
  const f=combat.foe; if(!FT) fightStart(); FT.low=Math.min(FT.low,player.hp);
  if(f && !f.dead){ const nm=f.name+' Lv'+foeLevel(f); if(!FT.foes.includes(nm)){ FT.foes.push(nm); FT.top=Math.max(FT.top,foeLevel(f)); note(FT.foes.length>1?'  …then '+nm+' steps up':'Fight: '+nm+(foeLevel(f)-FT.lv>=3?'  ☠ (way above me)':''),'fight'); } }      // only the ones who actually fight you
  if(!f || combat.phase!=='fight' || f.dead) return;
  const sk=skill(), win=windowFor(player);
  // a drink when it gets bad (if you remember you have one)
  if(player.hp<player.maxHp*0.32 && !FT.potion){ FT.potion=true; const k=healK(); if(k>=0 && rnd()<0.75){ try{ eatItem(k); note('Drinks/eats '+ITEMS[player.inv[k]||'bread']?.name+' mid-fight','fight'); }catch(e){} } }
  if(player.hp>player.maxHp*0.55) FT.potion=false;
  if(f.state==='windup'){
    if(FT.prevState!=='windup' || !FT.wu || FT.wu.f!==f){ FT.wu={ f, t0:clock, rt:clamp(gauss(0.31-0.07*sk,0.07),0.17,0.65), mis:rnd()<0.2-0.12*sk, lapse:rnd()<0.08-0.05*sk, early:rnd()<0.14-0.08*sk, aim:win*(0.2+0.75*rnd()), seen:null, side0:f.swingDir, re:null, fooled:rnd()<0.55-0.35*sk, pressed:0 }; }
    const W=FT.wu, el=clock-W.t0;
    if(!W.seen && el>=W.rt){ W.seen=W.mis?other(f.swingDir):f.swingDir; W.side0=f.swingDir; playerGuard=W.seen; }
    if(W.seen && f.swingDir!==W.side0 && !W.re){ W.re=clock+W.rt*0.85; W.side0=f.swingDir; }      // the feint shows its real side
    if(W.re && clock>=W.re && !W.fooled){ playerGuard=f.swingDir; W.re=1e9; }
    if(W.seen && !W.lapse && duel.st==='ready'){
      const want=W.early && !W.pressed ? win+0.08+rnd()*0.18 : W.aim;
      if(f.t<=want && (W.pressed===0 || (W.pressed===1 && rnd()<0.02))){ doParry(); W.pressed++; } }
  } else {
    if(FT.prevState==='windup') FT.nextAtk=Math.max(FT.nextAtk, clock+0.12+rnd()*0.3);
    if(duel.st==='ready' && clock>=FT.nextAtk && f.state!=='down'){
      let side;
      if(CASTER && isMagicWeapon()) side=spellPick(f,sk);
      else { const ok=rnd()<0.75+0.2*sk, alt=SIDES.filter(s=>s!==f.guardDir); side=ok?alt[Math.floor(rnd()*alt.length)]:(f.guardDir||'up');
        if(side===FT.lastSide && rnd()<0.3+0.5*sk) side=alt.find(s=>s!==side)||side; }
      playerGuard=side; FT.lastSide=side; doAttack(); FT.nextAtk=clock+0.28+rnd()*0.5+(1-sk)*0.25; } }
  FT.prevState=f.state; }

// ── conversations ──
const isExit=l=>/^(Farewell|Back|Leave|Not now|Close|Bow and leave|Goodbye|Bye|“?Not now|“?Later|“?Another (time|night)|“?Not yet|“?…Never mind|Never mind|Let (him|her) sleep|Continue\.?$|Walk away|Go\.?$|Done\.?$)/i.test(l.trim());
const HOSTILE=/attack|kill him|kill her|draw (your|steel)|fight (him|her|them)|cut (him|her) down|strike/i;
const DLG={ key:null, readUntil:0, steps:0, chosen:{}, conv:0 };
function teacherOff(name){ if(CFG.cls!=='necro' && /Vesna/.test(name)) return true; if(CFG.cls!=='mage' && /Orvell|Magister/.test(name)) return true; return false; }
function dialogStep(){
  const name=(document.getElementById('dlg-name')||{}).innerText||'', text=(document.getElementById('dlg-text')||{}).innerText||'';
  const btns=[...document.querySelectorAll('#dlg-opts button')].filter(b=>!b.classList.contains('off') && b.offsetParent!==null);
  const grid=document.querySelector('#dlg-opts .shop-grid'), hint=(document.querySelector('#dlg-opts .shop-hint')||{}).innerText||'';
  const key=name+'|'+text.slice(0,120)+'|'+btns.map(b=>b.innerText).join('/')+'|'+(grid?grid.children.length:0);
  if(key!==DLG.key){ DLG.key=key; const rt=0.8+text.length*0.022; DLG.readUntil=gt+rt; S.readT+=rt; return; }
  if(gt<DLG.readUntil) return;
  DLG.readUntil=gt+0.5; DLG.steps++;
  if(DLG.steps>60){ DLG.steps=0; closeDialog(); return; }
  if(grid){                                         // a shop
    const cells=[...grid.querySelectorAll('.shop-cell')];
    if(/sell/i.test(hint)){ const c=cells.find(c=>{ const id=(c.querySelector('.shop-slot')||{}).dataset; return id && isJunk(id.item); });
      if(c){ const id=c.querySelector('.shop-slot').dataset.item; c.click(); S.sells.push({id,t:gt}); note('Sells '+ITEMS[id].name,'gear'); return; } }
    else if(/buy/i.test(hint)){ const can=cells.filter(c=>!c.classList.contains('off'));
      const pick=can.find(c=>{ const id=c.querySelector('.shop-slot').dataset.item, it=ITEMS[id]; return it && WEAR.includes(it.slot) && itemFits(id,player.opts.gender) && gscore(id)>gscore(player.opts.equip[it.slot])+1.5; })
        || (healCount()<3 && player.purse>25 ? can.find(c=>{ const id=c.querySelector('.shop-slot').dataset.item; return ITEMS[id] && ITEMS[id].heal && !ITEMS[id].cure; }) : null)
        || (!hasSpade() && (CHOICE.moundSeen || journal()['Buried Things']) && player.purse>=12 ? can.find(c=>c.querySelector('.shop-slot').dataset.item==='shovel') : null)

const _u=update; B.errors=[];
update=function(dt){ const n=B.paused?1:B.speed; for(let k=0;k<n;k++){
    try{ _u(dt); }catch(e){ const m=(e&&e.message)||String(e); if(B.errors.length<50) B.errors.push({t:Math.round(gt), area:areaId, msg:m, stack:String(e&&e.stack||'').split('\n').slice(0,5).join(' | ')}); if(!B.errors.some(x=>x.msg===m && x!==B.errors[B.errors.length-1])) note('GAME ERROR (a real bug): '+m); }   // the game would freeze here for a player: note it and carry on
    B.step(dt); if(!running) break; } };
let dn=0; const _d=draw; draw=function(){ if(B.fast && (dn++%8)) return; _d(); };
B.report=function(){ const J=journal(); return { cls:CFG.cls, lvl:lvl(), area:areaId, land:LAND(areaId), t:Math.round(gt), purse:player.purse, hp:player.hp+'/'+player.maxHp,
  done:Object.values(J).filter(v=>v==='done').length, total:Object.keys(J).length, active:Object.keys(J).filter(k=>J[k]==='active'), fights:S.fights.length, deaths:S.deaths.length,
  equip:{...player.opts.equip}, finished:B.finished, bold:BOLD, vague:S.vague||{}, slow:Object.entries(S.qseen||{}).filter(([k,v])=>gt-v.t>DAY_LEN*3 && journal()[k.split('|')[0]]==='active' && (S.qcur||{})[k.split('|')[0]]===k).map(([k,v])=>k+' ('+Math.round((gt-v.t)/60)+' min, '+(v.found?'knew where to go':'no lead')+')'), open:JOURNAL.map(([t,f])=>{ let r=null; try{ r=f(); }catch(e){} return r&&r[0]==='active'?t+': '+String(r[1]).replace(/<[^>]+>/g,'').slice(0,220):null; }).filter(Boolean) }; };
note('A new '+({melee:'fighter',necro:'necromancer',mage:'mage'})[CFG.cls]+' sets out.','level');
})();
</script>

<script>
const $=id=>document.getElementById(id), frame=$('game');
const CLS={melee:'Melee',necro:'Necromancer',mage:'Mage'};
const qs=new URLSearchParams(location.search);
let speed=+(qs.get('speed')||1), bot=null, shown=0;
$('speed').value=speed; $('spv').textContent=speed+'×';
if(qs.get('cls')) $('cls').value=qs.get('cls');
$('speed').oninput=()=>{ speed=+$('speed').value; $('spv').textContent=speed+'×'; if(bot) bot.speed=speed; };
$('pause').onclick=()=>{ if(!bot) return; bot.paused=!bot.paused; $('pause').textContent=bot.paused?'Resume':'Pause'; };
$('go').onclick=start;
function start(){ bot=null; shown=0; $('log').innerHTML=''; frame.src='index.html?autoplay='+Date.now(); }
frame.onload=()=>{ const w=frame.contentWindow, d=w.document;
  // wait for you to sign in (inside the game, as always), then make a character and hand it to the bot
  const iv=setInterval(()=>{ try{
      const login=d.getElementById('login-screen'); if(login && !login.classList.contains('hidden')) return;
      const nm=d.getElementById('char-name-input'), st=d.getElementById('start-btn'); if(!nm || !st) return;
      clearInterval(iv);
      const g=Math.random()<0.5?'f':'m'; const gb=d.querySelector('.gender-btn[data-gender="'+g+'"]'); if(gb) gb.click();
      nm.value='Bot '+CLS[$('cls').value]; nm.dispatchEvent(new w.Event('input'));
      w.writeSaves=function(){ return true; }; w.saveGame=function(){};
      st.click();
      setTimeout(()=>{ w.BOT_CFG={cls:$('cls').value, speed, fast:qs.get('fast')==='1', seed:+(qs.get('seed')||0)||undefined};
        const s=d.createElement('script'); s.textContent=$('bot-src').textContent; d.body.appendChild(s); bot=w.BOT; if(bot) bot.speed=speed; },1500);
    }catch(e){} },300); };
const fmtT=s=>{ s=Math.round(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60); return (h?h+'h ':'')+m+'m'; };
setInterval(()=>{ if(!bot) { $('stats').innerHTML='<b>Status</b><span>Sign in inside the game below; the bot starts after that.</span>'; return; }
  try{ const r=bot.report();
    $('stats').innerHTML=[['Class',CLS[r.cls]],['Level',r.lvl],['Where',r.land+' · '+r.area],['Health',r.hp],['Coin',r.purse],['Quests',r.done+' done · '+r.active.length+' open'],['Fights',r.fights+' · '+r.deaths+' deaths'],['Game time',fmtT(r.t)],['Weapon',r.equip.weapon||'fists']].map(([a,b])=>'<b>'+a+'</b><span>'+b+'</span>').join('');
    const L=bot.log, box=$('log'); const atEnd=box.scrollTop+box.clientHeight>=box.scrollHeight-20;
    for(;shown<L.length;shown++){ const e=L[shown], div=document.createElement('div'); div.className=e.kind; div.textContent=e.msg; box.appendChild(div); }
    if(atEnd) box.scrollTop=box.scrollHeight;
  }catch(e){} },500);
start();
</script>
